    <!--
      Resolve the user's stored theme preference and apply `.dark` to <html>
      before any stylesheet paints, to avoid a flash of the wrong theme.
      Storage key and resolution rules MUST stay in sync with
      src/lib/theme.tsx (ThemeProvider).
    -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("inkwell:theme");
          const mode =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          const resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          if (resolved === "dark")
            document.documentElement.classList.add("dark");
        } catch (_) {
          /* localStorage unavailable — ThemeProvider will recover. */
        }
      })();
    </script>
    <!--
      Static boot splash — painted before any JS/CSS bundle loads, then
      replaced by React's <InkwellSplash intro={false}> (same sizes, so the
      hand-off is invisible). Mirrors src/components/InkwellSplash.tsx,
      InkwellMark.tsx and the "Inkwell brand animations" block in
      src/index.css — keep geometry, colours and timings in sync.
    -->
    <style>
      #boot-splash {
        --bs-bg: #ffffff; --bs-fg: #1c1814; --bs-accent: #e8731f;
        position: fixed; inset: 0; display: grid; place-items: center;
        overflow: hidden; background: var(--bs-bg); color: var(--bs-fg);
      }
      .dark #boot-splash { --bs-bg: #121212; --bs-fg: #efe9dc; --bs-accent: #f5893a; }
      #boot-splash .bs-grid {
        position: absolute; inset: 0; pointer-events: none;
        background-image: radial-gradient(circle, color-mix(in oklab, var(--bs-fg) 11%, transparent) 1.2px, transparent 1.4px);
        background-size: 24px 24px; background-position: center;
        -webkit-mask-image: radial-gradient(ellipse 55% 55% at 50% 50%, #000 30%, transparent 100%);
        mask-image: radial-gradient(ellipse 55% 55% at 50% 50%, #000 30%, transparent 100%);
      }
      #boot-splash .bs-stack { position: relative; display: flex; flex-direction: column; align-items: center; gap: 28px; }
      #boot-splash .bs-words { display: flex; flex-direction: column; align-items: center; gap: 4px; }
      #boot-splash .bs-mark { width: 112px; height: 112px; }
      #boot-splash .bs-wordmark { height: 48px; width: auto; animation: bs-write 1.1s 0.15s cubic-bezier(0.6, 0.1, 0.3, 1) both; }
      #boot-splash .bs-underline { width: 156px; height: 12px; overflow: visible; }
      #boot-splash .bs-underline path { stroke-dasharray: 1; animation: bs-underline 0.6s 1.2s ease-out both; }
      #boot-splash .bs-pen { animation: bs-pen 1.6s cubic-bezier(0.45, 0, 0.3, 1) infinite; }
      #boot-splash .bs-wave { animation: bs-wave 3.2s linear infinite; }
      @keyframes bs-pen { 0%, 100% { transform: translate(0, 0); } 45%, 55% { transform: translate(-3.2px, 4px); } }
      @keyframes bs-wave { from { transform: translateX(0); } to { transform: translateX(48px); } }
      @keyframes bs-write { from { clip-path: inset(-10% 100% -10% 0); } to { clip-path: inset(-10% 0 -10% 0); } }
      @keyframes bs-underline { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bs-wordmark, #boot-splash .bs-underline path, #boot-splash .bs-pen, #boot-splash .bs-wave { animation: none; }
      }
    </style>
