name = "excalidash-cf"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serve the built React SPA from ./dist.
# `not_found_handling = "single-page-application"` makes /s/:id and /share/:token
# fall back to index.html for client-side routing.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# R2 bucket holding scene JSON blobs and SVG thumbnails.
# Create with:  wrangler r2 bucket create excalidash
[[r2_buckets]]
binding = "R2"
bucket_name = "excalidash"
preview_bucket_name = "excalidash"

# D1 database holding the metadata index (scenes, share_tokens).
# Create with:  wrangler d1 create excalidash
# Then put the returned database_id in here.
[[d1_databases]]
binding = "DB"
database_name = "excalidash"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Non-secret config. Override per-env in [env.production.vars].
[vars]
# Comma-separated list of allowed origins for CORS (leave empty = same-origin only).
ALLOWED_ORIGINS = ""

# Secrets to set via:
#   wrangler secret put AUTH_PASSWORD
#   wrangler secret put SESSION_SECRET
# AUTH_PASSWORD: shared password for /login (single-user mode).
# SESSION_SECRET: random 32+ byte string used to HMAC session cookies.
