<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    Inkwell — favicon.
    Monochrome ink-on-paper mark: a folder outline with a single
    hand-drawn sketch stroke inside. Stays in sync with the React
    <InkwellMark> component in src/components/InkwellMark.tsx.

    Color adapts to the OS theme so the mark stays legible against
    both light and dark browser chrome (Firefox + Safari respect
    prefers-color-scheme inside SVG favicons; Chromium uses the
    light-mode value, which is fine on its tab strip too).
  -->
  <style>
    path {
      stroke: #1c1814;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (prefers-color-scheme: dark) {
      path { stroke: #efe9dc; }
    }
  </style>
  <!-- Folder outline with a notched tab on the upper left. -->
  <path
    d="M14 12 L26 12 L32 20 L50 20 Q56 20 56 26 L56 50 Q56 56 50 56 L14 56 Q8 56 8 50 L8 18 Q8 12 14 12 Z"
    stroke-width="5"
  />
  <!-- Sketch stroke inside the folder. -->
  <path
    d="M16 44 C22 32 28 32 30 40 C32 46 38 28 44 38"
    stroke-width="4"
  />
</svg>
