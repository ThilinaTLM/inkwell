<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Inkwell — loading</title>
  <!--
    Inkwell boot splash. Artwork is kept inside the central ~420x360 units so
    "slice" scaling never crops it on phones or ultrawide screens.
    Animations (pure CSS, so they run inside <img>, <object> and inline):
      · the pen dips into the well on a loop  (acts as the loading indicator)
      · the ink surface ripples sideways
      · the wordmark is "written" left→right once, then underlined
    Static renderers and prefers-reduced-motion show the final composed frame.
  -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#ece6da"/>
    </pattern>
    <clipPath id="bottle"><path d="M27 17 V21 C27 25 9 26 9 36 V48 Q9 56 17 56 H47 Q55 56 55 48 V36 C55 26 37 25 37 21 V17 Z"/></clipPath>
    <clipPath id="write"><rect class="write" x="659" y="495" width="282" height="120"/></clipPath>
  </defs>
  <style>
    .pen   { animation: dip 1.6s cubic-bezier(.45,0,.3,1) infinite; }
    .wave  { animation: ripple 3.2s linear infinite; }
    .write { transform-box: fill-box; transform-origin: left center; animation: write 1.1s .15s cubic-bezier(.6,.1,.3,1) both; }
    .under { stroke-dasharray: 1; stroke-dashoffset: 0; animation: underline .6s 1.2s ease-out both; }
    @keyframes dip       { 0%,100% { transform: translate(0,0); } 45%,55% { transform: translate(-3.2px,4px); } }
    @keyframes ripple    { from { transform: translateX(0); } to { transform: translateX(48px); } }
    @keyframes write     { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes underline { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .pen, .wave, .write, .under { animation: none; }
    }
  </style>

  <rect x="-2000" y="-2000" width="5600" height="5000" fill="#ffffff"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <g transform="translate(716.8 285) scale(2.6)">
    <g clip-path="url(#bottle)"><path class="wave" fill="#e8731f" d="M-48 43 q12 -7 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 V64 H-48 Z"/></g>
    <path stroke="#1c1814" stroke-width="4.5" d="M23 17 H41 M27 17 V21 C27 25 9 26 9 36 V48 Q9 56 17 56 H47 Q55 56 55 48 V36 C55 26 37 25 37 21 V17"/>
    <g class="pen"><path stroke="#1c1814" stroke-width="4.5" d="M50 3 L35 22"/></g>
  </g>

